name: SECRET_SCAN
on:
  push:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required: full history enables differential scanning

      - uses: fluidattacks/ss-action@0.2.0 # Use latest released version
        id: scan
        with:
          scan_config_path: .github/secret-scan-config.yaml
          scanner_mode: full
      
      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ss
          path: results-ss.csv
          if-no-files-found: ignore

      - name: Fail on vulnerabilities
        if: steps.scan.outputs.vulnerabilities_found == 'true'
        run: exit 1